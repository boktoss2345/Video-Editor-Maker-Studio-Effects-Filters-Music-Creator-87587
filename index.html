<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Video</title>
  <style>
    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #mainVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #amazonButton {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 1000;
      display: none;
      width: 55vw;
      max-width: 680px;
      height: auto;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <video id="mainVideo" autoplay muted playsinline webkit-playsinline preload="auto">
    <source src="assets/0913.mp4" type="video/mp4">
  </video>

  <img id="amazonButton" src="assets/buton584d.png" alt="Open Amazon Appstore">

  <script>
    (function () {
      var video = document.getElementById('mainVideo');
      var button = document.getElementById('amazonButton');
      var buttonShown = false;
      var timerStarted = false;
      var openingAppstore = false;

      function showButton() {
        if (buttonShown) return;
        buttonShown = true;
        button.style.display = 'block';
      }

      function startButtonTimer() {
        if (timerStarted) return;
        timerStarted = true;
        window.setTimeout(showButton, 5000);
      }

      function tryPlay() {
        video.muted = true;
        var playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function () {});
        }
      }

      function lockLandscape() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      }

      function openAmazonAppstore(event) {
        if (event) {
          event.preventDefault();
        }

        if (openingAppstore) return;
        openingAppstore = true;
        window.location.href = 'amzn://apps/android?initiatePurchaseFlow=true&asin=B0FSTNPJT6';

        window.setTimeout(function () {
          openingAppstore = false;
        }, 1000);
      }

      video.addEventListener('playing', startButtonTimer, { once: true });
      video.addEventListener('loadeddata', tryPlay);
      video.addEventListener('canplay', tryPlay);
      window.addEventListener('load', function () {
        lockLandscape();
        tryPlay();
      });

      button.addEventListener('click', openAmazonAppstore);
      button.addEventListener('touchend', openAmazonAppstore, { passive: false });

      tryPlay();
      lockLandscape();
    }());
  </script>
</body>
</html>
